{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Blogify</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>

    <div class="register-page">

        <div class="register-container">

            <!-- LEFT SIDE -->
            <div class="register-form-section">

                <div class="brand">
                    BLOGIFY
                </div>

                <div class="register-content">

                    <h2>Register</h2>

                    <p class="register-subtitle">
                        Create your account and start sharing your stories with the world.
                    </p>


                    {% if messages %}
                        <div class="messages">
                            {% for message in messages %}
                                <p>{{ message }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}


                        <div class="form-group">

                            <label for="username">
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter email"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password(atleast 8 characters)"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="confirm_password">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                placeholder="Confirm password"
                                required
                            >

                        </div>


                        <button type="submit" class="register-button">
                            REGISTER
                        </button>

                    </form>


                    <p class="login-text">

                        Already have an account?

                        <a href="{% url 'login' %}">
                            Login
                        </a>

                    </p>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="register-image-section">

                <div class="illustration-circle circle-one"></div>

                <div class="illustration-circle circle-two"></div>

                <img
                    src="{% static 'images/login-illustration.png' %}"
                    alt="Blog management illustration"
                >

            </div>

        </div>

    </div>

</body>
</html>
