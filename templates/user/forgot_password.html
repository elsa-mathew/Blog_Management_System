{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Blogify</title>
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/forgot_password.css' %}">

</head>


<body>

    <div class="forgot-page">

        <div class="forgot-container">


            <!-- LEFT SIDE -->

            <div class="forgot-form-section">

                <div class="brand">
                    BLOGIFY
                </div>


                <div class="forgot-content">

                    <div class="forgot-icon">
                        <i class="bi bi-lock"></i>
                    </div>


                    <h2>Forgot Password?</h2>

                    <p class="forgot-subtitle">
                        Don't worry! Enter your email address and we'll help you reset your password.
                    </p>


                    {% if messages %}

                        <div class="messages">

                            {% for message in messages %}

                                <p>{{ message }}</p>

                            {% endfor %}

                        </div>

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}


                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                required
                            >

                        </div>


                        <button type="submit" class="reset-button">
                            RESET PASSWORD
                        </button>

                    </form>


                    <p class="back-login">

                        Remember your password?

                        <a href="{% url 'login' %}">
                            Back to Login
                        </a>

                    </p>

                </div>

            </div>



            <!-- RIGHT SIDE -->

            <div class="forgot-image-section">

                <div class="illustration-circle circle-one"></div>

                <div class="illustration-circle circle-two"></div>

                <img
                    src="{% static 'images/login-illustration.png' %}"
                    alt="Password reset illustration"
                >

            </div>


        </div>

    </div>


</body>

</html>
