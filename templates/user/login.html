{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <!-- LEFT SIDE -->
            <div class="login-form-section">

                <div class="brand">
                    BLOGIFY
                </div>

                <div class="login-content">

                    <h2>Login</h2>

                    <p class="login-subtitle">
                        Welcome back! Log in to your blog management system.
                    </p>

                    {% if messages %}
                        <div class="messages">
                            {% for message in messages %}
                                <p>{{ message }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="form-group">
                            <label for="username">Username</label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Enter your password"
                                    required
                                >

                                

                            </div>
                        </div>

                        <div class="forgot-wrapper">
                            <a href="{% url 'forgot_password' %}">
                                Forgot password?
                            </a>
                        </div>

                        <button type="submit" class="login-button">
                            LOGIN
                        </button>

                    </form>

                    <p class="register-text">
                        Don't have an account?
                        <a href="{% url 'register' %}">Register</a>
                    </p>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="login-image-section">

                <div class="illustration-circle circle-one"></div>
                <div class="illustration-circle circle-two"></div>

                <!-- Replace this with your own image -->
                <img src="{% static 'images/login-illustration.png' %}"
                     alt="Blog management illustration">

            </div>

        </div>

    </div>

</body>
</html>
