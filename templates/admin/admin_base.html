{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Admin | Blogify{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/admin.css' %}"
    >

</head>

<body>

<div class="admin-layout">

    <aside class="admin-sidebar">

        <div class="admin-logo">

            <div class="admin-logo-icon">
                <i class="bi bi-pencil-square"></i>
            </div>

            <span>Blogify</span>

        </div>


        <div class="admin-label">
            ADMIN PANEL
        </div>


        <nav class="admin-nav">

            <a href="{% url 'admin_dashboard' %}"
               class="admin-nav-item">

                <i class="bi bi-grid"></i>

                <span>Dashboard</span>

            </a>


            <a
    href="{% url 'admin_users' %}"
    class="admin-nav-item {% block users_active %}{% endblock %}"
>

    <i class="bi bi-people"></i>

    <span>Users</span>

</a>
            <a
    href="{% url 'admin_posts' %}"
    class="admin-nav-item {% block posts_active %}{% endblock %}"
>

    <i class="bi bi-journal-text"></i>

    <span>Posts</span>

</a>


            <a
    href="{% url 'admin_categories' %}"
    class="admin-nav-item {% block categories_active %}{% endblock %}"
>

    <i class="bi bi-folder"></i>

    <span>Categories</span>

</a>


            <a href="{% url 'admin_tags' %}"
               class="admin-nav-item">

                <i class="bi bi-tags"></i>

                <span>Tags</span>

            </a>


            <a
    href="{% url 'admin_comments' %}"
    class="admin-nav-item"
>
    <i class="bi bi-chat-left-text"></i>
    <span>Comments</span>
</a>

        </nav>


        <div class="admin-sidebar-bottom">

            <a href="{% url 'logout' %}"
               class="admin-nav-item logout-item">

                <i class="bi bi-box-arrow-right"></i>

                <span>Logout</span>

            </a>

        </div>

    </aside>



    <main class="admin-main">

        <header class="admin-topbar">

            <div>
                <span>Admin Panel</span>
            </div>

            <div class="admin-user">

                <div class="admin-top-avatar">
                    {{ request.user.username|first|upper }}
                </div>

                <span>
                    {{ request.user.username }}
                </span>

            </div>

        </header>


        <div class="admin-content">

            {% block content %}
            {% endblock %}

        </div>

    </main>

</div>

</body>

</html>
